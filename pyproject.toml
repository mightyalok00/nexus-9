[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-9"
version = "0.1.0"
description = "NEXUS-9: Modular Research-Grade AI/ML System with Causal Simulator and Autonomous Research Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NEXUS-9 Research Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "pandera>=0.18.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "optuna>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
causal = [
    "dowhy>=0.11",
    "networkx>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]
