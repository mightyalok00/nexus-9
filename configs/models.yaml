# ML Laboratory Model Specifications
arena:
  cv_folds: 5
  scoring_metric: "f1_weighted"
  random_seed: 20261016

models:
  baseline_dummy:
    strategy: "stratified"
  bagging_random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 5
    n_jobs: -1
  boosting_xgboost:
    n_estimators: 120
    max_depth: 5
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
    eval_metric: "logloss"
  voting_ensemble:
    voting: "soft"
    weights: [1, 2, 1] # RF, XGB, SVM
  svm_classifier:
    kernel: "rbf"
    C: 1.5
    probability: true
