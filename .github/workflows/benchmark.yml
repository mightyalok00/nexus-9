name: NEXUS-9 Full Pipeline — Run Now
run-name: "NEXUS-9 Full Pipeline • ${{ inputs.run_label || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Optional label to identify this run in the Actions history"
        required: false
        type: string
        default: "manual"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  benchmark:
    name: Train models, simulate futures, and evaluate causal benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Model Arena Training
        run: python scripts/train_models.py

      - name: Execute Future Simulator Trajectory
        run: python scripts/run_simulation.py

      - name: Run Full Causal & Benchmark Suite
        run: python scripts/run_benchmarks.py

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
