name: NEXUS-9 Benchmark Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    name: Execute Full Causal & Model Arena Benchmarks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Execute Model Arena Training
      run: python scripts/train_models.py

    - name: Execute Future Simulator Trajectory
      run: python scripts/run_simulation.py

    - name: Run Full Causal & Benchmark Suite
      run: python scripts/run_benchmarks.py

    - name: Upload Benchmark Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-reports
        path: reports/
